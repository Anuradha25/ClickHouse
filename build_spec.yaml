version: 0.1
component: build
timeoutInSeconds: 24000
shell: bash
failImmediatelyOnError: true

env:
  variables:
    SUBMODULE_JOBS: "16"
    BUILD_JOBS: "4"
    BUILD_FORMAT: "docker"
    LOCAL_IMAGE_TAG: "clickhouse-source-local:ci"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Prepare source and submodules"
    command: |
      set -euxo pipefail
      git submodule sync --recursive
      git submodule update --init --recursive --jobs "${SUBMODULE_JOBS}"
      test -f contrib/sysroot/README.md

      IMAGE_TAG="$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_BUILD_RUN_ID}" | cut -c1-12)"
      export IMAGE_TAG
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Install host dependencies"
    command: |
      set -euxo pipefail
      dnf -y install git podman tar xz which rsync

  - type: Command
    name: "Debug runner and podman limits"
    command: |
      set -euxo pipefail
      echo "=== Host memory ==="
      free -h || true
      grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true

      echo "=== Host disk ==="
      df -h || true
      df -h /var/lib/containers || true
      du -sh /var/lib/containers 2>/dev/null || true
      du -sh /var/lib/containers/storage 2>/dev/null || true

      echo "=== Podman info ==="
      podman info || true

      echo "=== Podman store ==="
      podman system df || true

      echo "=== Build cgroup limits (if set) ==="
      cat /sys/fs/cgroup/memory.max 2>/dev/null || true
      cat /sys/fs/cgroup/memory.current 2>/dev/null || true

      echo "=== Container memory view ==="
      podman run --rm ubuntu:24.04 bash -lc 'free -h; cat /sys/fs/cgroup/memory.max || true'

  - type: Command
    name: "Build ClickHouse image from source"
    command: |
      set -euxo pipefail

      IMAGE_SOURCE="$(git config --get remote.origin.url || true)"
      IMAGE_REVISION="$(git rev-parse HEAD || true)"
      IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      podman system prune -af --volumes || true
      podman image prune -af || true
      podman builder prune -af || true

      CONTEXT_DIR="/tmp/ch-build-context"
      rm -rf "${CONTEXT_DIR}"
      mkdir -p "${CONTEXT_DIR}"

      rsync -a --delete \
        --exclude ".git" \
        --exclude ".github" \
        --exclude "build" \
        --exclude "cmake-build-*" \
        --exclude "out" \
        --exclude "tmp" \
        --exclude "cache" \
        --exclude "ccache" \
        --exclude ".vscode" \
        --exclude ".idea" \
        --exclude ".DS_Store" \
        --exclude "node_modules" \
        --exclude "contrib/rust_vendor" \
        ./ "${CONTEXT_DIR}/"

      test -f "${CONTEXT_DIR}/contrib/sysroot/README.md"
      du -sh "${CONTEXT_DIR}" || true

      podman build \
        --memory=96g \
        --memory-swap=96g \
        --format "${BUILD_FORMAT}" \
        --no-cache \
        -f "${CONTEXT_DIR}/Dockerfile.oci" \
        -t "${LOCAL_IMAGE_TAG}" \
        --build-arg DEBIAN_FRONTEND=noninteractive \
        --build-arg BUILD_JOBS="${BUILD_JOBS}" \
        --build-arg ENABLE_TESTS=OFF \
        --build-arg ENABLE_UTILS=OFF \
        --build-arg ENABLE_RUST=OFF \
        --build-arg IMAGE_SOURCE="${IMAGE_SOURCE}" \
        --build-arg IMAGE_REVISION="${IMAGE_REVISION}" \
        --build-arg IMAGE_CREATED="${IMAGE_CREATED}" \
        "${CONTEXT_DIR}"

outputArtifacts:
  - name: clickhouse-source-image
    type: DOCKER_IMAGE
    location: clickhouse-source-local:ci
