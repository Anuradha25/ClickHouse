version: 0.1
component: build
timeoutInSeconds: 24000
shell: bash
failImmediatelyOnError: true

env:
  variables:
    SUBMODULE_JOBS: "16"
    BUILD_JOBS: "4"
    BUILD_FORMAT: "docker"
    LOCAL_IMAGE_TAG: "clickhouse-source-local:ci"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Prepare source and submodules"
    command: |
      set -euxo pipefail
      git submodule sync --recursive
      git submodule update --init --recursive --jobs "${SUBMODULE_JOBS}"
      IMAGE_TAG="$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_BUILD_RUN_ID}" | cut -c1-12)"
      export IMAGE_TAG
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Install host dependencies"
    command: |
      set -euxo pipefail
      dnf -y install git podman tar xz which

  - type: Command
    name: "Build ClickHouse image from source"
    command: |
      set -euxo pipefail

      IMAGE_SOURCE="$(git config --get remote.origin.url || true)"
      IMAGE_REVISION="$(git rev-parse HEAD || true)"
      IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      podman system prune -af --volumes || true

      podman build \
        --format "${BUILD_FORMAT}" \
        --pull=always \
        -f Dockerfile.oci \
        -t "${LOCAL_IMAGE_TAG}" \
        --build-arg BUILD_JOBS="${BUILD_JOBS}" \
        --build-arg ENABLE_TESTS=OFF \
        --build-arg ENABLE_UTILS=OFF \
        --build-arg ENABLE_RUST=OFF \
        --build-arg IMAGE_SOURCE="${IMAGE_SOURCE}" \
        --build-arg IMAGE_REVISION="${IMAGE_REVISION}" \
        --build-arg IMAGE_CREATED="${IMAGE_CREATED}" \
        .

outputArtifacts:
  - name: clickhouse-source-image
    type: DOCKER_IMAGE
    location: clickhouse-source-local:ci
