version: 0.1
component: build
timeoutInSeconds: 43200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    SUBMODULE_JOBS: "16"
    LOCAL_IMAGE_TAG: "clickhouse-source-local:ci"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Prepare source and submodules"
    command: |
      set -euxo pipefail
      git submodule sync
      git submodule update --init --jobs "${SUBMODULE_JOBS}"
      IMAGE_TAG="$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_BUILD_RUN_ID}" | cut -c1-12)"
      export IMAGE_TAG
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Install host dependencies"
    command: |
      set -euxo pipefail
      dnf -y install \
        git \
        podman \
        python3 \
        which \
        tar \
        xz

  - type: Command
    name: "Build ClickHouse from source via Praktika"
    command: |
      set -euxo pipefail
      podman system prune -af || true

      # Uses ClickHouse's own CI build recipe/toolchain
      python3 -m ci.praktika run "Build (amd_release)"

      # Locate produced clickhouse binary
      test -x ci/tmp/build/programs/clickhouse || test -x build/programs/clickhouse

      if [ -x ci/tmp/build/programs/clickhouse ]; then
        mkdir -p build/programs
        cp -f ci/tmp/build/programs/clickhouse build/programs/clickhouse
      fi

  - type: Command
    name: "Package runtime image"
    command: |
      set -euxo pipefail
      podman build \
        --format docker \
        --pull=always \
        -f Dockerfile.runtime \
        -t "${LOCAL_IMAGE_TAG}" \
        .

outputArtifacts:
  - name: clickhouse-source-image
    type: DOCKER_IMAGE
    location: clickhouse-source-local:ci
