version: 0.1
component: build
timeoutInSeconds: 28800
shell: bash
failImmediatelyOnError: true

env:
  variables:
    SUBMODULE_JOBS: "16"
    BUILD_JOBS: "4"
    LOCAL_IMAGE_TAG: "clickhouse-source-local:ci"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Prepare source and submodules"
    command: |
      set -euxo pipefail
      git submodule sync
      git submodule update --init --jobs "${SUBMODULE_JOBS}"
      IMAGE_TAG="$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_BUILD_RUN_ID}" | cut -c1-12)"
      export IMAGE_TAG
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Build ClickHouse binary and package image"
    command: |
      set -euxo pipefail

      cmake -S . -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DENABLE_TESTS=OFF \
        -DENABLE_UTILS=OFF \
        -DENABLE_RUST=OFF

      ninja -C build -j "${BUILD_JOBS}" clickhouse

      podman system prune -af || true

      podman build \
        --format docker \
        --pull=always \
        -f Dockerfile.runtime \
        -t "${LOCAL_IMAGE_TAG}" \
        .

outputArtifacts:
  - name: clickhouse-source-image
    type: DOCKER_IMAGE
    location: clickhouse-source-local:ci
