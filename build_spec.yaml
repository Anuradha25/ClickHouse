version: 0.1
component: build
timeoutInSeconds: 28800
shell: bash
failImmediatelyOnError: true

env:
  variables:
    SUBMODULE_JOBS: "16"
    BUILD_JOBS: "4"
    LOCAL_IMAGE_TAG: "clickhouse-source-local:ci"
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Prepare source and submodules"
    command: |
      set -euxo pipefail
      git submodule sync
      git submodule update --init --jobs "${SUBMODULE_JOBS}"
      IMAGE_TAG="$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_BUILD_RUN_ID}" | cut -c1-12)"
      export IMAGE_TAG
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Install host dependencies"
    command: |
      set -euxo pipefail
      dnf -y install \
        git \
        podman \
        which \
        tar \
        xz

  - type: Command
    name: "Build ClickHouse binary in builder image and package runtime image"
    command: |
      set -euxo pipefail

      podman system prune -af || true

      # Pull a smaller explicit arch-tagged builder image first.
      podman pull docker.io/clickhouse/binary-builder:latest-amd64

      podman run --rm \
        -v "$PWD":/ClickHouse \
        -w /ClickHouse \
        docker.io/clickhouse/binary-builder:latest-amd64 \
        bash -lc '
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_UTILS=OFF \
            -DENABLE_RUST=OFF
          ninja -C build -j '"${BUILD_JOBS}"' clickhouse
        '

      podman build \
        --format docker \
        --pull=always \
        -f Dockerfile.runtime \
        -t "${LOCAL_IMAGE_TAG}" \
        .

outputArtifacts:
  - name: clickhouse-source-image
    type: DOCKER_IMAGE
    location: clickhouse-source-local:ci
